# image tag does not exist -> ImagePullBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: shopadmin
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken-image }
  template:
    metadata:
      labels: { app: broken-image }
    spec:
      containers:
        - name: web
          image: nginx:this-tag-does-not-exist
