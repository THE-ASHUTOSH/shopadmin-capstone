name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: pytest -v
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: frontend

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: image names
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopadmin" >> $GITHUB_ENV
      - run: |
          docker build -t $PREFIX-backend:${{ github.sha }} ./backend
          docker build -t $PREFIX-frontend:${{ github.sha }} ./frontend

      # pinned to the v0.36.0 commit
      - name: trivy scan backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.PREFIX }}-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy scan frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.PREFIX }}-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        run: |
          docker push $PREFIX-backend:${{ github.sha }}
          docker push $PREFIX-frontend:${{ github.sha }}

  # deploys the images from this run to a throwaway kind cluster inside the runner.
  # an always-on EKS cluster costs ~$150/month, for a real cluster swap the kind step for a kubeconfig secret
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: shopadmin
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: load images from ghcr into the cluster
        run: |
          for app in backend frontend; do
            img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopadmin-$app:${{ github.sha }}
            docker pull $img
            kind load docker-image $img --name shopadmin
          done
      - run: kubectl apply -f k8s/namespace.yaml
      - run: helm upgrade --install shopadmin ./helm/shopadmin -n shopadmin --set tag=${{ github.sha }} --wait --timeout 5m
      - name: smoke test through the frontend
        run: |
          kubectl get pods,svc,ingress,hpa -n shopadmin
          kubectl port-forward -n shopadmin svc/frontend 8080:8080 &
          sleep 3
          curl -sf localhost:8080/api/products/stats
